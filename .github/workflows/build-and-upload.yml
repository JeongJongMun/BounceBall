name: Build & Upload to Google Drive

on:
  push:
    branches: [main, dev]
    # v로 시작하는 태그를 밀면 빌드 후 GitHub Release까지 발행한다
    tags: ['v*']
  # itch.io 업로드용 빌드를 아무 때나 뽑을 수 있게 수동 실행도 열어둔다
  workflow_dispatch:

jobs:
  # 폴더 이름을 한 번만 정해 모든 플랫폼이 공유한다.
  # 각 잡에서 시각을 재면 빌드 소요 시간이 달라(Android는 20분 이상) 폴더가 쪼개진다.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      folder: ${{ steps.folder.outputs.name }}
    steps:
      - name: Decide folder name
        id: folder
        run: echo "name=$(TZ=Asia/Seoul date +%Y_%m_%d_%H%M)_${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      # 한쪽이 깨져도 다른 플랫폼 빌드는 끝까지 간다
      fail-fast: false
      matrix:
        # Android는 IL2CPP라 빌드가 20분을 넘긴다. dev 푸시마다 돌리면 Actions 사용량이
        # 빠르게 소진되므로 main 푸시·태그·수동 실행에서만 포함한다.
        # 태그 푸시는 ref_name이 태그명(v1.0.0)이라 main 비교로는 걸리지 않는다.
        targetPlatform: >-
          ${{ fromJSON(
            (github.ref_name == 'main'
             || startsWith(github.ref, 'refs/tags/')
             || github.event_name == 'workflow_dispatch')
            && '["StandaloneWindows64","WebGL","Android"]'
            || '["StandaloneWindows64","WebGL"]'
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 안드로이드 에디터 이미지와 IL2CPP 중간 산출물이 커서 러너 디스크가 부족해지기 쉽다.
      # 빌드와 무관한 사전 설치 툴체인만 지운다.
      - name: Free disk space
        if: matrix.targetPlatform == 'Android'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          df -h /

      # Library는 플랫폼마다 임포트 결과가 달라 캐시를 섞으면 안 된다
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Ml-em
          # itch.io 배포와 실기기 사이드로드용이라 APK로 뽑는다.
          # 플레이 스토어에 올리려면 androidAppBundle(AAB)로 바꾸고 키스토어를 붙여야 한다.
          # 키스토어를 주지 않으면 디버그 키로 서명된다 — 설치·테스트에는 문제없다.
          androidExportType: androidPackage

      - name: Set build name
        id: buildname
        run: |
          sudo chown -R $USER build
          echo "name=${{ needs.prepare.outputs.folder }}_${{ matrix.targetPlatform }}" >> "$GITHUB_OUTPUT"

      # 플랫폼마다 파일 하나만 남긴다. 드라이브에 폴더가 쌓이지 않고 받는 쪽도 단순해진다.
      - name: Package artifact
        run: |
          set -euo pipefail
          NAME="${{ steps.buildname.outputs.name }}"
          mkdir -p dist

          case "${{ matrix.targetPlatform }}" in
            WebGL)
              # itch.io는 zip 최상단에 index.html이 있어야 HTML 게임으로 인식한다.
              # 빌드 폴더째 압축하면 한 겹 더 들어가 "index.html을 찾을 수 없다"며 거부한다.
              INDEX=$(find build/WebGL -name index.html | head -n1)
              if [ -z "$INDEX" ]; then
                echo "::error::WebGL 빌드에서 index.html을 찾지 못했습니다"
                ls -R build/WebGL
                exit 1
              fi
              (cd "$(dirname "$INDEX")" && zip -qr "$GITHUB_WORKSPACE/dist/$NAME.zip" .)
              ;;

            Android)
              # APK 한 개면 설치까지 끝난다. 압축하면 받는 쪽에서 풀어야 해 번거롭다.
              APK=$(find build/Android -name "*.apk" | head -n1)
              if [ -z "$APK" ]; then
                echo "::error::Android 빌드에서 apk를 찾지 못했습니다"
                ls -R build/Android
                exit 1
              fi
              cp "$APK" "dist/$NAME.apk"
              ;;

            *)
              # 실행에 exe 말고도 여러 파일이 필요하므로 폴더째 압축한다.
              # 압축 안에 루트 폴더가 하나 있어야 풀었을 때 파일이 흩어지지 않는다.
              mv "build/${{ matrix.targetPlatform }}" build/Ml-em
              (cd build && zip -qr "$GITHUB_WORKSPACE/dist/$NAME.zip" Ml-em)
              ;;
          esac

          ls -lh dist

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildname.outputs.name }}
          path: dist
          retention-days: 7

      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          # 세 플랫폼이 같은 폴더에 각자의 파일 하나씩을 올린다.
          # 폴더 이름은 prepare 잡이 정한 값이라 모든 잡이 동일하다.
          rclone copy dist "gdrive:${{ needs.prepare.outputs.folder }}" -v --transfers 8

  # 태그를 밀었을 때만 GitHub Release를 발행한다.
  # 브랜치 푸시마다 릴리스를 만들면 의미 없는 항목이 쌓인다.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # 릴리스 생성·자산 업로드에 필요
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "받은 아티팩트:"
          find artifacts -type f | sort

          # 아티팩트 파일명에는 빌드 시각이 붙어 있어 릴리스 자산으로는 장황하다.
          # 받는 사람이 바로 알아볼 이름으로 바꿔 올린다.
          mkdir -p release
          APK=$(find artifacts -type f -name "*_Android.apk" | head -n1)
          WIN=$(find artifacts -type f -name "*_StandaloneWindows64.zip" | head -n1)

          if [ -z "$APK" ] || [ -z "$WIN" ]; then
            echo "::error::릴리스에 올릴 산출물을 찾지 못했습니다 (APK='$APK' WIN='$WIN')"
            exit 1
          fi
          cp "$APK" "release/Ml-em-$TAG-Android.apk"
          cp "$WIN" "release/Ml-em-$TAG-Windows.zip"
          ls -lh release

          # 재실행이나 자산 교체에도 견디도록 존재 여부를 보고 갈라진다.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ml-em $TAG" \
              --generate-notes
          fi
