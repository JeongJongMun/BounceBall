name: Build & Upload to Google Drive

on:
  push:
    branches: [main, dev]

jobs:
  build:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: BounceBall

      - name: Zip build
        run: |
          sudo chown -R $USER build
          cd build/StandaloneWindows64
          zip -r "$GITHUB_WORKSPACE/BounceBall-${{ github.ref_name }}-${{ github.run_number }}.zip" .

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: BounceBall-${{ github.ref_name }}-${{ github.run_number }}
          path: BounceBall-${{ github.ref_name }}-${{ github.run_number }}.zip
          retention-days: 7

      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          rclone copy "BounceBall-${{ github.ref_name }}-${{ github.run_number }}.zip" gdrive: -v
